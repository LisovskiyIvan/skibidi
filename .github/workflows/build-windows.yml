name: Build Windows Executable

on:
  workflow_dispatch:
    inputs:
      ffmpeg_url:
        description: Immutable, versioned FFmpeg Windows ZIP URL (or configure WINDOWS_FFMPEG_URL)
        required: false
        type: string
      ffmpeg_sha256:
        description: FFmpeg ZIP SHA-256 (or configure WINDOWS_FFMPEG_SHA256)
        required: false
        type: string
      oswald_url:
        description: Immutable, versioned Oswald source ZIP URL (or configure WINDOWS_OSWALD_URL)
        required: false
        type: string
      oswald_sha256:
        description: Oswald ZIP SHA-256 (or configure WINDOWS_OSWALD_SHA256)
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      VIDEO_PROCESSOR_FFMPEG_URL: ${{ inputs.ffmpeg_url || vars.WINDOWS_FFMPEG_URL }}
      VIDEO_PROCESSOR_FFMPEG_SHA256: ${{ inputs.ffmpeg_sha256 || vars.WINDOWS_FFMPEG_SHA256 }}
      VIDEO_PROCESSOR_OSWALD_URL: ${{ inputs.oswald_url || vars.WINDOWS_OSWALD_URL }}
      VIDEO_PROCESSOR_OSWALD_SHA256: ${{ inputs.oswald_sha256 || vars.WINDOWS_OSWALD_SHA256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync --locked --python 3.11 --extra windows
      - name: Build shared PyInstaller specification
        run: uv run --frozen python build_windows.py
      - name: Archive onedir output and write checksum
        shell: pwsh
        run: |
          Compress-Archive -Path "dist_windows/VideoProcessor" -DestinationPath "VideoProcessor-Windows.zip" -Force
          $hash = (Get-FileHash "VideoProcessor-Windows.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  VideoProcessor-Windows.zip" | Set-Content "VideoProcessor-Windows.zip.sha256" -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: VideoProcessor-Windows-${{ github.run_id }}
          path: |
            dist_windows/VideoProcessor/
            VideoProcessor-Windows.zip
            VideoProcessor-Windows.zip.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: VideoProcessor-Windows-${{ github.run_id }}
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            VideoProcessor-Windows.zip
            VideoProcessor-Windows.zip.sha256
