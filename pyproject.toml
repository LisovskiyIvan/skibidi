[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "video-transcription"
version = "0.1.0"
description = "Video segmentation, speech transcription, subtitle, and publishing pipeline"
readme = "README.md"
authors = [
    { name = "Lisovskii Ivan" },
]
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES", "VOSK_MODEL_LICENSE"]
requires-python = ">=3.9"
keywords = ["ffmpeg", "subtitles", "transcription", "video", "vosk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Video :: Conversion",
]
dependencies = [
    "vosk>=0.3.45",
]

[project.urls]
Homepage = "https://github.com/LisovskiyIvan/skibidi"
Repository = "https://github.com/LisovskiyIvan/skibidi"
Issues = "https://github.com/LisovskiyIvan/skibidi/issues"

[project.optional-dependencies]
youtube = [
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.1",
    "google-auth-httplib2>=0.2",
]
download = [
    "yt-dlp>=2024.4.9",
]
stt = [
    "faster-whisper>=1.0",
]
# CUDA runtime libraries for faster-whisper on NVIDIA GPUs. Optional and large
# (~1.3 GB); CPU-only users should NOT install this. Install with:
#   uv sync --extra stt --extra stt-cuda
stt-cuda = [
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12",
]
gui = [
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.1",
    "google-auth-httplib2>=0.2",
    "yt-dlp>=2024.4.9",
    "faster-whisper>=1.0",
]
build = [
    "pyinstaller>=6.14,<7",
    "wheel>=0.45",
]
windows = [
    "pyinstaller>=6.14,<7",
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.1",
    "google-auth-httplib2>=0.2",
    "yt-dlp>=2024.4.9",
    "faster-whisper>=1.0",
]
dev = [
    "pytest>=8",
    "mypy>=1.10",
    "ruff>=0.5",
    "tomli>=2",
]

[project.scripts]
video-processor = "video_processor.__main__:main"

[tool.setuptools]
packages = ["video_processor"]

[tool.setuptools.package-data]
video_processor = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
# Long pre-existing ffprobe/ffmpeg command literals, and argparse one-per-line
# CLI blocks read better as a single long line.
ignore = ["E501"]

[tool.mypy]
# 3.10 is the lowest target supported by the mypy 2.x toolchain; the package
# still runs on 3.9 thanks to `from __future__ import annotations` everywhere.
python_version = "3.10"
# Run bare `mypy` (no path args): config-driven discovery honours `exclude`,
# whereas passing a directory on the command line bypasses it.
files = ["video_processor", "tests"]
# numpy 2.x ships PEP 695 `type` aliases in its stub that are invalid under our
# python_version = "3.10" target. It is only a transitive dependency (via
# faster-whisper), so an empty local stub shadows the broken bundled one.
mypy_path = ["stubs"]
strict = true
warn_unused_ignores = true
warn_redundant_casts = true

# The Tkinter stubs (ttk.grid **kwargs, lambda callbacks) are extremely noisy and
# the GUI is a thin adapter over the typed core, so these non-domain error codes
# are silenced for it. All real domain logic is fully checked.
[[tool.mypy.overrides]]
module = "video_processor.ui"
disable_error_code = ["arg-type", "misc", "type-arg"]

[[tool.mypy.overrides]]
module = "vosk"
# vosk ships no py.typed / stubs.
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "ctranslate2",
    "faster_whisper",
    "google.auth.transport.requests",
    "google.oauth2.credentials",
    "google_auth_oauthlib.flow",
    "googleapiclient.discovery",
    "googleapiclient.http",
    "yt_dlp",
]
# Optional upload/download/STT dependencies; these are not installed by default.
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
