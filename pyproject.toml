[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "video-transcription"
version = "0.1.0"
description = "Vosk-based video transcription pipeline"
requires-python = ">=3.9"
dependencies = [
    "vosk>=0.3.45",
]

[project.scripts]
video-processor = "video_processor.__main__:main"

[tool.setuptools]
packages = ["video_processor"]

